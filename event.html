<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Laporan Event | PMI Jakarta Utara</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        :root {
            --primary: #dc2626;
            --primary-dark: #991b1b;
            --primary-light: #fef2f2;
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #0f172a;
            --muted: #64748b;
            --border: #e2e8f0;
            --shadow: 0 10px 40px rgba(0, 0, 0, 0.06);
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #fef2f2, #fff5f5);
            min-height: 100vh;
            padding: 25px 15px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 0 15px;
        }

        /* Animasi */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes shimmer {
            0% {
                background-position: -200% center;
            }
            100% {
                background-position: 200% center;
            }
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-6px);
            }
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.05);
            }
        }

        .form-card {
            background: white;
            border-radius: 24px;
            padding: 28px;
            border: 1px solid var(--border);
            box-shadow: 0 15px 50px rgba(220, 38, 38, 0.10);
            animation: fadeInUp 0.6s ease forwards;
            position: relative;
            overflow: hidden;
        }

        .form-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, #dc2626, #ef4444, #dc2626);
            background-size: 200% center;
            animation: shimmer 3s infinite linear;
        }

        .form-group input:hover,
        .form-group textarea:hover {
            border-color: #f87171;
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .header .logo {
            width: 75px;
            height: 75px;
            background: linear-gradient(135deg, #dc2626, #ef4444);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 15px;
            box-shadow: 0 8px 20px rgba(220, 38, 38, 0.25);
            animation: float 4s ease-in-out infinite;
            transition: 0.3s;
        }

        .header .logo:hover {
            transform: scale(1.08);
            box-shadow: 0 12px 30px rgba(220, 38, 38, 0.35);
        }

        .header .logo i {
            font-size: 2rem;
            color: white;
        }

        .header h1 {
            font-size: 1.7rem;
            color: var(--text);
            font-weight: 800;
            background: linear-gradient(135deg, #dc2626, #991b1b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header p {
            color: var(--muted);
        }

        .greeting-badge {
            background: linear-gradient(135deg, #dc2626, #ef4444);
            color: white;
            padding: 8px 16px;
            border-radius: 50px;
            display: inline-block;
            margin-bottom: 15px;
            font-size: 0.8rem;
            font-weight: 600;
            box-shadow: 0 4px 15px rgba(220, 38, 38, 0.2);
            animation: pulse 2s infinite;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            color: #334155;
            margin-bottom: 6px;
            font-size: 0.85rem;
        }

        .form-group label i {
            color: var(--primary);
            width: 20px;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid var(--border);
            border-radius: 14px;
            background: #f8fafc;
            transition: 0.2s;
            font-family: 'Inter', sans-serif;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            background: white;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(220, 38, 38, 0.08);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .section-title {
            font-weight: 700;
            color: var(--text);
            margin: 25px 0 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid var(--border);
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 1rem;
        }

        .section-title i {
            color: var(--primary);
        }

        .os-item {
            background: #fefafb;
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 15px;
            margin-bottom: 15px;
            transition: 0.2s;
        }

        .os-item:hover {
            border-color: #fecaca;
            background: #fffcfc;
        }

        .os-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding-bottom: 10px;
            border-bottom: 1px dashed var(--border);
        }

        .os-header h4 {
            color: var(--primary);
            font-weight: 700;
        }

        .os-header h4 i {
            margin-right: 8px;
        }

        .btn-remove {
            background: #fee2e2;
            border: none;
            color: #dc2626;
            padding: 6px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.2s;
        }

        .btn-remove:hover {
            background: #fecaca;
        }

        .btn-add {
            background: #fee2e2;
            border: none;
            color: #dc2626;
            padding: 12px;
            border-radius: 14px;
            width: 100%;
            cursor: pointer;
            font-weight: 600;
            transition: 0.2s;
        }

        .btn-add:hover {
            background: #fecaca;
            transform: translateY(-2px);
        }

        .btn-add-alat {
            background: none;
            border: none;
            color: #dc2626;
            cursor: pointer;
            font-weight: 600;
            transition: 0.2s;
            padding: 8px 0;
        }

        .btn-add-alat:hover {
            color: #991b1b;
            transform: translateX(4px);
        }

        .btn-submit {
            background: linear-gradient(135deg, #dc2626, #ef4444);
            color: white;
            border: none;
            padding: 14px 20px;
            border-radius: 50px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            margin-top: 25px;
            transition: 0.3s;
        }

        .btn-submit:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(220, 38, 38, 0.3);
        }

        .btn-submit i {
            font-size: 1.1rem;
        }

        .note {
            background: #f8fafc;
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 12px;
            margin-top: 20px;
            text-align: center;
            color: #475569;
            font-size: 0.85rem;
        }

        .note strong {
            color: var(--primary);
        }

        .alat-item {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
            align-items: center;
        }

        .alat-item input {
            flex: 1;
            padding: 10px 14px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: #f8fafc;
            font-family: 'Inter', sans-serif;
        }

        .alat-item input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(220, 38, 38, 0.08);
        }

        /* RESPONSIVE MOBILE */
        @media (max-width: 768px) {
            body {
                padding: 15px 8px;
            }

            .container {
                max-width: 100%;
                padding: 0;
            }

            .form-card {
                padding: 18px;
                border-radius: 20px;
            }

            .header .logo {
                width: 60px;
                height: 60px;
            }

            .header .logo i {
                font-size: 1.5rem;
            }

            .header h1 {
                font-size: 1.4rem;
                line-height: 1.3;
            }

            .header p {
                font-size: 0.8rem;
            }

            .greeting-badge {
                font-size: 0.75rem;
                padding: 6px 12px;
            }

            .form-row {
                grid-template-columns: 1fr;
                gap: 0;
            }

            .form-group input,
            .form-group textarea {
                font-size: 16px;
                padding: 12px;
            }

            .section-title {
                font-size: 0.95rem;
            }

            .os-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 8px;
            }

            .btn-remove {
                width: 100%;
                text-align: center;
            }

            .alat-item {
                flex-direction: column;
            }

            .alat-item button {
                width: 100%;
            }

            .btn-submit {
                height: 52px;
                font-size: 0.9rem;
            }
        }

        /* Animasi fade-in untuk elemen baru */
        .os-item,
        .alat-item {
            animation: fadeInUp 0.3s ease forwards;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="form-card">
            <div class="header">
                <div class="logo">
                    <i class="fas fa-calendar-alt"></i>
                </div>
                <div class="greeting-badge" id="greetingText"></div>
                <h1>Form Laporan Event</h1>
                <p>PMI Jakarta Utara | Tim Kesehatan</p>
            </div>

            <form id="reportForm">
                <!-- INFORMASI EVENT -->
                <div class="section-title"><i class="fas fa-info-circle"></i> Informasi Event</div>
                <div class="form-row">
                    <div class="form-group">
                        <label><i class="fas fa-calendar"></i> Hari/Tanggal</label>
                        <input type="text" id="tanggal" placeholder="Selasa, 24 Maret 2026" required>
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-clock"></i> Pukul</label>
                        <input type="text" id="pukul" placeholder="08:00 Wib" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label><i class="fas fa-hourglass-end"></i> Selesai</label>
                        <input type="text" id="selesai" placeholder="16:00 Wib" required>
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-tasks"></i> Kegiatan</label>
                        <input type="text" id="kegiatan" placeholder="Timkes Arus Mudik Lebaran 2026" required>
                    </div>
                </div>
                <div class="form-group">
                    <label><i class="fas fa-map-marker-alt"></i> Alamat</label>
                    <input type="text" id="alamat" placeholder="Terminal Tanjung Priok" required>
                </div>

                <!-- DATA PENERIMA MANFAAT (OS) -->
                <div class="section-title"><i class="fas fa-users"></i> Penerima Manfaat (OS)</div>
                <div id="osList"></div>
                <button type="button" class="btn-add" onclick="tambahOS()">
                    <i class="fas fa-plus-circle"></i> + Tambah OS
                </button>

                <!-- ALAT YANG DIGUNAKAN -->
                <div class="section-title"><i class="fas fa-syringe"></i> Alat Yang Digunakan</div>
                <div id="alatList"></div>
                <button type="button" class="btn-add-alat" onclick="tambahAlat()">
                    <i class="fas fa-plus-circle"></i> + Tambah Alat
                </button>

                <!-- PETUGAS -->
                <div class="section-title"><i class="fas fa-users"></i> Petugas</div>
                <div class="form-row">
                    <div class="form-group">
                        <label><i class="fas fa-truck"></i> Driver</label>
                        <input type="text" id="driver" placeholder="Ade Prayogo" required>
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-user-md"></i> Crew</label>
                        <input type="text" id="crew" placeholder="Septyan & Reva" required>
                    </div>
                </div>
                <div class="form-group">
                    <label><i class="fas fa-building"></i> Posko</label>
                    <input type="text" id="posko" placeholder="Salwa" required>
                </div>

                <button type="button" class="btn-submit" onclick="sendToWA()">
                    <i class="fab fa-whatsapp"></i> Kirim Laporan ke WhatsApp
                </button>
            </form>

            <div class="note">
                <i class="fas fa-info-circle"></i> Laporan akan dikirim ke Call Center PMI Jakarta Utara<br>
                <strong>089-8866-9000</strong>
            </div>
        </div>
    </div>

    <script>
        const WA_NUMBER = '628988669000';
        let osCount = 0;
        let alatCount = 0;

        function getGreeting() {
            const hours = new Date().getHours();
            if (hours >= 5 && hours < 11) return "Selamat Pagi";
            if (hours >= 11 && hours < 15) return "Selamat Siang";
            if (hours >= 15 && hours < 18) return "Selamat Sore";
            return "Selamat Malam";
        }

        document.getElementById('greetingText').innerHTML = getGreeting();

        function tambahOS() {
            osCount++;
            const container = document.getElementById('osList');
            const div = document.createElement('div');
            div.className = 'os-item';
            div.id = `os_${osCount}`;
            div.innerHTML = `
                <div class="os-header">
                    <h4><i class="fas fa-user"></i> OS #${osCount}</h4>
                    <button type="button" class="btn-remove" onclick="hapusOS(${osCount})"><i class="fas fa-trash"></i> Hapus</button>
                </div>
                <div class="form-group">
                    <label>Nama / OS</label>
                    <input type="text" class="os-nama" placeholder="Contoh: Risghy/L/28Thn">
                </div>
                <div class="form-group">
                    <label>Kondisi (Cek Kesehatan)</label>
                    <textarea class="os-kondisi" rows="2" placeholder=""></textarea>
                </div>
                <div class="form-group">
                    <label>Keluhan</label>
                    <input type="text" class="os-keluhan" placeholder="Keluhan pasien (jika ada)">
                </div>
                <div class="form-group">
                    <label>Tindakan</label>
                    <input type="text" class="os-tindakan" placeholder="Tindakan yang diberikan">
                </div>
            `;
            container.appendChild(div);
        }

        function hapusOS(id) {
            const el = document.getElementById(`os_${id}`);
            if (el) el.remove();
        }

        function tambahAlat() {
            alatCount++;
            const container = document.getElementById('alatList');
            const div = document.createElement('div');
            div.className = 'alat-item';
            div.id = `alat_${alatCount}`;
            div.innerHTML = `
                <input type="text" class="alat-nama" placeholder="Nama alat" style="flex:1">
                <button type="button" class="btn-remove" onclick="hapusAlat(${alatCount})" style="padding:8px 12px;"><i class="fas fa-trash"></i></button>
            `;
            container.appendChild(div);
        }

        function hapusAlat(id) {
            const el = document.getElementById(`alat_${id}`);
            if (el) el.remove();
        }

        function formatOSList() {
            const items = document.querySelectorAll('.os-item');
            if (items.length === 0) return "*Tidak ada data OS*";
            
            let result = `*Jumlah Penerima Manfaat   :* ${items.length} Jiwa \n\n`;
            items.forEach((item, idx) => {
                const nama = item.querySelector('.os-nama')?.value || '-';
                const kondisi = item.querySelector('.os-kondisi')?.value || '-';
                const keluhan = item.querySelector('.os-keluhan')?.value || '-';
                const tindakan = item.querySelector('.os-tindakan')?.value || '-';
                
                result += `${idx+1}. *OS  :* ${nama}\n`;
                if (kondisi !== '-') result += `       *Kondisi    :* ${kondisi}\n`;
                if (keluhan !== '-') result += `       *Keluhan    :* ${keluhan}\n`;
                if (tindakan !== '-') result += `       *Tindakan   :* ${tindakan}\n`;
                result += `\n`;
            });
            return result;
        }

        function formatAlatList() {
            const items = document.querySelectorAll('.alat-item input');
            if (items.length === 0) return "1. Handscoon 6 Set\n2. Masker Tas PP 3 Pcs\n3. GCU 2 Alat\n4. Tensi\n5. Alkohol Swab 26 Pcs\n6. Strip Glukosa 15 Pcs\n7. Strip Kolestrol 15 pcs\n8. Strip Asam Urat 15 pcs\n9. Lancet 16";
            
            let result = "";
            items.forEach((item, idx) => {
                const nama = item.value.trim();
                if (nama) {
                    result += `${idx+1}. ${nama}\n`;
                }
            });
            return result || "1. Handscoon 6 Set\n2. Masker Tas PP 3 Pcs\n3. GCU 2 Alat\n4. Tensi\n5. Alkohol Swab 26 Pcs\n6. Strip Glukosa 15 Pcs\n7. Strip Kolestrol 15 pcs\n8. Strip Asam Urat 15 pcs\n9. Lancet 16";
        }

        function sendToWA() {
            const tanggal = document.getElementById('tanggal').value;
            const pukul = document.getElementById('pukul').value;
            const selesai = document.getElementById('selesai').value;
            const kegiatan = document.getElementById('kegiatan').value;
            const alamat = document.getElementById('alamat').value;
            const driver = document.getElementById('driver').value;
            const crew = document.getElementById('crew').value;
            const posko = document.getElementById('posko').value;

            if (!tanggal || !pukul || !selesai || !kegiatan || !alamat || !driver || !crew || !posko) {
                alert('Mohon lengkapi semua data yang wajib diisi!');
                return;
            }

            const greeting = getGreeting();
            const osList = formatOSList();
            const alatList = formatAlatList();

            const message = `*${greeting} IZIN MELAPORKAN PELAYANAN EVENT AMBULAN GAWAT DARURAT* 

- *Hari/Tanggal :*  ${tanggal} 
- *Pukul              :* ${pukul} Wib
- *Selesai           :* ${selesai} Wib
- *Kegiatan        :* ${kegiatan}
- *Alamat            :* (${alamat})

- *Dengan Rincian Sebagai Berikut  :* 

${osList}
*Keterangan*: -

- *Alat Yang Digunakan :*
${alatList}

*Dilaporkan :*
- *Driver* : ${driver}
- *Crew* : ${crew}
- *Posko :* ${posko}

*Call Center :*
PMI Kota Jakarta Utara
Telp. 089-8866-9000
*#Terus Kobarkan Kebaikan*`;

            window.open(`https://wa.me/${WA_NUMBER}?text=${encodeURIComponent(message)}`, '_blank');
        }
    </script>
</body>
    </html>
